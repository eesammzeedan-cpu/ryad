plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android { 
    namespace 'com.ryadah.medicaldirectory'
    compileSdk 35

    defaultConfig { 
        applicationId 'com.ryadah.medicaldirectory'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0' 
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
